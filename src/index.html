<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="project spots, Akon" />
    <meta name="author" content="Jon Nicdao" />
    <meta name="keywords" content="image sharing, html, css" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/logo.svg')%>"
          alt="Logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-button">
              <img
                src="<%=require('./images/pencil-light.svg')%>"
                alt="Pencil Light Icon"
                class="profile__avatar-icon"
              />
            </button>
            <img
              src="<%= require('./images/avatar.jpg') %>"
              alt="Bessie Coleman"
              class="profile__avatar"
            />
          </div>

          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-button">
              <img
                src="<%= require('./images/pencil.svg') %>"
                alt="Pencil Icon"
              />
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-button">
            <img src="<%= require('./images/plus.svg') %>" alt="plus icon" />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <img src="#" alt="" class="card__image" />
                <button type="button" class="card__delete-button"></button>
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-button"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__text">&copy; 2025 Jon Nicdao</p>
      </footer>
    </div>

    <div class="modal" id="edit-profile-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-button"></button>
        <h2 class="modal__title">Edit profile</h2>
        <form class="modal__form" name="edit-profile-form">
          <label for="profile-name-input" class="modal__label">
            Name
            <input
              id="profile-name-input"
              type="text"
              class="modal__input"
              placeholder="Type your name"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="modal__error" id="profile-name-input-error"></span>
          </label>
          <label for="profile-description-input" class="modal__label"
            >Description
            <input
              id="profile-description-input"
              type="text"
              class="modal__input"
              placeholder="Describe yourself"
              minlength="2"
              maxlength="200"
              required
            />
            <span
              class="modal__error"
              id="profile-description-input-error"
            ></span>
          </label>
          <button type="submit" class="modal__submit-button">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="new-post-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-button"></button>
        <h2 class="modal__title">New post</h2>
        <form class="modal__form" name="new-post-modal">
          <label for="card-image-input" class="modal__label">
            Image link
            <input
              id="card-image-input"
              type="url"
              class="modal__input"
              placeholder="Paste a link to the picture"
              required
            />
            <span class="modal__error" id="card-image-input-error"></span>
          </label>
          <label for="card-description-input" class="modal__label"
            >Caption
            <input
              id="card-description-input"
              type="text"
              class="modal__input"
              placeholder="Type your caption"
              minlength="2"
              maxlength="30"
              required
            />
            <span class="modal__error" id="card-description-input-error"></span>
          </label>
          <button type="submit" class="modal__submit-button">Save</button>
        </form>
      </div>
    </div>

    <div class="modal modal_type_preview" id="preview-modal">
      <div class="modal__container modal__container_type_preview">
        <button
          aria-label="close modal"
          class="modal__close-button modal__close-button_type_preview"
        ></button>
        <img src="#" alt="" class="modal__image" />
        <h2 class="modal__caption"></h2>
      </div>
    </div>

    <div class="modal" id="avatar-modal">
      <div class="modal__container">
        <button
          aria-label="Close Modal"
          type="button"
          class="modal__close-button"
        ></button>
        <h3 class="modal__title">Edit Avatar</h3>
        <form class="modal__form" id="edit-avatar-form">
          <label for="profile-avatar-input" class="modal__label">
            Avatar
            <input
              id="profile-avatar-input"
              type="url"
              class="modal__input"
              placeholder="Paste the link to the image"
              name="Avatar"
              required
            />
            <span class="modal__error" id="profile-avatar-input-error"></span>
          </label>
          <button class="modal__submit-button" type="submit">Save</button>
        </form>
      </div>
    </div>

    <div class="modal modal_type_delete" id="delete-modal">
      <div class="modal__container modal__container_type_delete">
        <button
          aria-label="Close Modal"
          type="button"
          class="modal__close-button modal__close-button_type_delete"
        ></button>
        <h3 class="modal__title modal__title_type_delete">
          Are you sure you want to delete this image?
        </h3>
        <form class="modal__form modal__form_type_delete" id="delete-form">
          <button
            class="modal__button modal__button_type_delete modal__submit-button"
            type="submit"
          >
            Delete
          </button>
          <button
            class="modal__button modal__button_type_cancel modal__cancel-button"
            type="button"
          >
            Cancel
          </button>
        </form>
      </div>
    </div>
  </body>
</html>

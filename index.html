<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="project spots, Akon"/><meta name="author" content="Jon Nicdao"/><meta name="keywords" content="image sharing, html, css"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="a40f8b9ceac4854ce51a.svg" alt="Logo"/></header><main class="content"><section class="profile page__section"><img src="2fc47fd8e9a9bcd9612f.jpg" alt="Bessie Coleman" class="profile__avatar"/><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-button"><img src="65d8affc5335655b643b.svg" alt="pencil icon"/> Edit Profile</button></div><button type="button" class="profile__add-button"><img src="2f3d95cd677269aa842f.svg" alt="plus icon"/> New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><img src="#" alt="" class="card__image"/> <button type="button" class="card__delete-button"></button><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-button"></button></div></li></template></ul></section></main><footer class="footer"><p class="footer__text">&copy; 2025 Jon Nicdao</p></footer></div><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-button"></button><h2 class="modal__title">Edit profile</h2><form class="modal__form" name="edit-profile-form"><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span class="modal__error" id="profile-name-input-error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span class="modal__error" id="profile-description-input-error"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" class="modal__close-button"></button><h2 class="modal__title">New post</h2><form class="modal__form" name="new-post-modal"><label for="card-image-input" class="modal__label">Image link <input id="card-image-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span class="modal__error" id="card-image-input-error"></span></label> <label for="card-description-input" class="modal__label">Caption <input id="card-description-input" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span class="modal__error" id="card-description-input-error"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div><div class="modal modal_type_preview" id="preview-modal"><div class="modal__container modal__container_type_preview"><button aria-label="close modal" class="modal__close-button modal__close-button_type_preview"></button> <img src="#" alt="" class="modal__image"/><h2 class="modal__caption"></h2></div></div></body></html>
